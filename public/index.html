<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bill-Free</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0b1f44"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f9;--card:#fff;--tx:#0f1b2d;--mu:#64718a;--br:#e1e6ef;--pr:#0b3d91;--prt:#fff;--ac:#e8eefb;--ok:#0f7b4a;--okb:#e3f5ec;--bad:#b3261e;--wn:#9a6700;--wnb:#fff3d6;--hd:#0b1f44}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1220;--card:#131c2e;--tx:#e6ecf7;--mu:#93a1bb;--br:#243049;--pr:#4f8bff;--prt:#04122e;--ac:#1a2744;--ok:#4ade9a;--okb:#12342a;--bad:#ff8a80;--wn:#f5c451;--wnb:#3a2f10;--hd:#070d1a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--card:#131c2e;--tx:#e6ecf7;--mu:#93a1bb;--br:#243049;--pr:#4f8bff;--prt:#04122e;--ac:#1a2744;--ok:#4ade9a;--okb:#12342a;--bad:#ff8a80;--wn:#f5c451;--wnb:#3a2f10;--hd:#070d1a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
header{background:var(--hd);color:#fff}
.hd{max-width:720px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.lg{width:30px;height:30px;border-radius:7px;background:#fff;color:#0b3d91;display:grid;place-items:center;font-weight:800}
.demo{background:var(--wnb);color:var(--wn);font-size:12px;text-align:center;padding:6px 12px;font-weight:600}
.w{max-width:720px;margin:0 auto;padding:18px 16px 32px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:15px;margin:0 0 10px}
.mu{color:var(--mu);font-size:13px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600;opacity:.75}
.card{background:var(--card);border:1px solid var(--br);border-radius:10px;padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(15,27,45,.05)}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;border:1px solid var(--br);background:var(--card);color:var(--tx);padding:10px 16px}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}
button.s{padding:6px 12px;font-size:13px}
button.g{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);padding:6px 12px;font-size:13px}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--br);background:var(--bg);color:var(--tx);margin:4px 0 12px}
label{font-size:13px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.bal{background:linear-gradient(135deg,#0b3d91,#1b5fd6);color:#fff;border:0}
.bal .big{font-size:34px;font-weight:800;margin:4px 0 12px}
.acct{background:rgba(255,255,255,.14);border-radius:8px;padding:10px 12px}
.acct b{font-size:20px;letter-spacing:2px}
.bal button{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--br);margin-bottom:6px}
.tabs button{border:0;border-radius:0;background:none;color:var(--mu);border-bottom:3px solid transparent;padding:10px 14px}
.tabs button.on{color:var(--pr);border-color:var(--pr)}
table{width:100%;border-collapse:collapse}
td{padding:10px 4px;border-bottom:1px solid var(--br)}tr:last-child td{border-bottom:0}
.cr{color:var(--ok);font-weight:700;text-align:right}.db{color:var(--bad);font-weight:700;text-align:right}
.bar{height:6px;background:var(--ac);border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pr)}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:20px;background:var(--okb);color:var(--ok)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.ft{text-align:center;margin-top:24px}
.chat{height:300px;overflow-y:auto;background:var(--bg);border-radius:8px;padding:10px;margin:10px 0;display:flex;flex-direction:column;gap:6px}.b{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--br);align-self:flex-start;word-break:break-word}.b.me{align-self:flex-end;background:var(--pr);color:var(--prt);border-color:var(--pr)}.b small{display:block;font-size:11px;opacity:.7}.chip{display:inline-block;font-size:12px;background:var(--ac);color:var(--pr);padding:2px 8px;border-radius:12px;margin:2px 4px 2px 0}.pw{background:var(--wnb);color:var(--wn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--hd);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;z-index:9}.toast.show{opacity:1;transform:translateX(-50%)}.toast.bad{background:var(--bad)}.wide{max-width:1000px}.pn{display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-size:14px}.pn a{color:#fff;text-decoration:none;opacity:.8}.pn a.on,.pn a:hover{opacity:1}.pn a.cta{background:#fff;color:var(--hd);padding:6px 14px;border-radius:8px;font-weight:700;opacity:1}
.hero{text-align:center;padding:36px 8px 24px}.hero h1{font-size:clamp(28px,6vw,44px);line-height:1.1;margin:0 0 12px;font-weight:800}.hero p{font-size:17px;color:var(--mu);max-width:560px;margin:0 auto 22px}.hero .btn{margin:4px}
.btn{display:inline-block;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px;border:1px solid var(--br);color:var(--tx);background:var(--card)}.btn.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:18px 0}.feat .card{margin:0}.ic{font-size:26px}
.steps{counter-reset:s}.steps .card{position:relative;padding-left:60px}.steps .card:before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--pr);color:var(--prt);display:grid;place-items:center;font-weight:700}
.band{background:var(--hd);color:#fff;border-radius:14px;text-align:center;padding:28px 16px;margin:24px 0}.band h2{font-size:22px}.band .btn{margin-top:8px}
.foot{border-top:1px solid var(--br);margin-top:28px;padding:18px 0;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;color:var(--mu);font-size:13px}.foot a{color:var(--mu);margin-right:14px;text-decoration:none}
.authw{max-width:440px;margin:0 auto}.bk{display:inline-block;margin-bottom:12px;color:var(--pr);font-weight:600;text-decoration:none}
.sec h2{font-size:24px;margin:28px 0 4px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.two .card{margin:0}textarea{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--br);background:var(--bg);color:var(--tx);margin:4px 0 12px}
.tabs{overflow-x:auto}.tabs button{white-space:nowrap}.hd{flex-wrap:wrap;gap:8px}.lang{width:auto;margin:0 0 0 8px;padding:4px 8px;font-size:13px;background:transparent;color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:8px}.lang option{color:#000}.rm a{color:var(--ok);font-weight:600;text-decoration:none;margin-right:10px}.sc2{font-size:44px;font-weight:800;color:var(--pr);line-height:1}
</style></head><body>
<header><div class="hd"><div class="logo" onclick="location.hash='#home'" style="cursor:pointer"><div class="lg">B</div>Bill-Free</div><div id="nav"></div></div></header>
<div class="w" id="app"></div>
<div id="toast" class="toast"></div>
<script src="/app.js"></script></body></html>
