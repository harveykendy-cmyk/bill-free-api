# TEST / DEMO deployment only. Do not process real customer funds.
services:
  - type: web
    name: bill-free-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: bill-free-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET
        sync: false
      - key: PREFERRED_BANK
        value: test-bank
      - key: WITHDRAW_FEE_PCT
        value: "1"
      - key: PGSSLMODE
        value: require
databases:
  - name: bill-free-db
    plan: free
    databaseName: billfree
    user: billfree