# Render Blueprint: one web service + one Postgres database.
# Deploy: push this folder to GitHub, then Render dashboard > New > Blueprint > pick the repo.
services:
  - type: web
    name: bill-free
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:init && npm start   # tables are created or updated on every deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: bill-free-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET        # Render will ask you to paste this (use your sk_test_ key first)
        sync: false
      - key: PREFERRED_BANK
        value: test-bank            # change to wema-bank when you go live
      - key: WITHDRAW_FEE_PCT
        value: "1"
databases:
  - name: bill-free-db
    plan: free
